<h2 mat-dialog-title class="title">{{title}}</h2>
<mat-dialog-content class="content">
  <div>
    {{message}}
  </div>

  @if(showActivationInfos){
  <mat-form-field class="annotations" appearance="fill">
    <mat-label>{{'Annotations' | translate}}</mat-label>
    <textarea matInput #anno (input)="onAnnoChange(anno.value)" cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="4"
      cdkAutosizeMaxRows="6"></textarea>
  </mat-form-field>



  <div>{{'In collection' | translate}} <strong>{{currentCollection}}</strong></div>
  <br />
  <div>{{'Enabled drivers' | translate}}</div>
  <app-drivers-list class="drivers-list" (selectedDrivers)="selectedDrivers=$event"></app-drivers-list>

  }

</mat-dialog-content>

<mat-dialog-actions class="actions">
  <button mat-flat-button color="primary" [color]="'primary'"
    [mat-dialog-close]="{status: true, annotations: annotation, drivers: selectedDrivers}">
    {{action | translate}}
  </button>
  <button mat-stroked-button [mat-dialog-close]="{status: false}">
    {{'Cancel' | translate}}
  </button>
</mat-dialog-actions>
