<h2 mat-dialog-title>{{'Enable drivers' | translate}}</h2>
<mat-dialog-content class="content">
  <div>{{'Select the drivers to enable' | translate}}</div>
  <mat-chip-listbox class="drivers" [multiple]="true" (change)="driversSelectionChange($event)">
    @for (driver of availalbleDrivers; track driver) {
    <mat-chip-option [value]="driver" [selected]="driver.selected">
      {{driver.name}}
    </mat-chip-option>
    }
  </mat-chip-listbox>

</mat-dialog-content>

<mat-dialog-actions class="actions">
  <button mat-flat-button color="primary" [color]="'primary'" [mat-dialog-close]="{drivers: selectedDrivers}">
    {{'Save' | translate}}
  </button>
  <button mat-stroked-button [mat-dialog-close]="false">
    {{'Cancel' | translate}}
  </button>
</mat-dialog-actions>
