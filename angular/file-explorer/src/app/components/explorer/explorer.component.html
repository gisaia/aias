<div class="files-tree">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding class="file">
      <button mat-icon-button disabled></button>
      <span class="name">{{node.name}}</span>
    </mat-tree-node>
    <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding class="file">
      <button mat-icon-button [attr.aria-label]="'Toggle ' + node.name" matTreeNodeToggle>
        <mat-icon>
          {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
        </mat-icon>
      </button>
      <span (click)="listArchives(node.path)" [class.folder]="node.is_dir" class="name"
      [class.active]="selectedFilePath === node.path">{{node.name}}</span>
      @if (node.is_dir) {
        <span class="material-symbols-outlined pointer activate-btn" (click)="activate(node)"
            [matTooltip]="'Activate this folder in collection'| translate:{collection: currentCollection}" [matTooltipPosition]="'right'">
          add_circle
        </span>
      }
      @if (node.isLoading) {
        <mat-progress-spinner class="loader" [diameter]="20" [strokeWidth]="2" [color]="'primary'"
        mode="indeterminate"></mat-progress-spinner>
      }
    </mat-tree-node>
  </mat-tree>
</div>
