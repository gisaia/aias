arlas_url_search: $ARLAS_URL_SEARCH|http://arlas-server:9999/arlas/explore/{collection}/_search?f=id:eq:{item}
agate_prefix: $AGATE_PREFIX|/arlas/agate
host: $AGATE_HOST|127.0.0.1
port: $AGATE_PORT|8004
url_header: X-Forwarded-Uri
headers_for_arlas:
  - authorization
  - arlas-org-filter
services:
  airs:
    jwt_name: authorization
    jwt_location: 
      - headers
    private:
      - pattern: (/object/collections/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/(?P<asset>[^/]+)
        part: path
    public:
      - pattern: (/object/collections/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/thumbnail
        part: path
  titiler:
    jwt_name: authorization
    jwt_location:
      - headers
      - query_params
    private:
      - pattern: (/object/collections/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/(?P<asset>[^/]+)
        part: query.url.url.path # takes the query parametters, use it as a url, then extract the path
urbac:
  role_file: conf/roles.yaml
  jwks_uri: $JWKS_URI|
  verify_jwt: $VERIFY_JWT|true
  verify_ssl: $VERIFY_SSL|true
  jwt_audience: arlas-backend
  jwt_header: authorization