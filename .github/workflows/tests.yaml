name: Test AIAS

on:
  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run All?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

      run_hadolint:
        description: 'Run Hadolint?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

      run_aias_am:
        description: 'Run AIAS AM tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

      run_aias_g1:
        description: 'Run AIAS G1 tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

      run_aias_g2:
        description: 'Run AIAS G2 tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_aias_g3:
        description: 'Run AIAS G3 tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_aias_g4_fs:
        description: 'Run AIAS G4 FS tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_aias_g4_gs:
        description: 'Run AIAS G4 GS tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_aias_g4_minio:
        description: 'Run AIAS G4 Minio tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_geodes_stac:
        description: 'Run Geodes STAC tests?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'


jobs:
  hadolint:
    if: inputs.run_hadolint == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: [agate, airs, aproc-proc, aproc-service, stac-geodes, fam, arlas-fam-wui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          failure-threshold: "error"
          dockerfile: "docker/Dockerfile-${{ matrix.image_name }}"
 
  aias-tests-am:
    if: inputs.run_aias_am == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack
      run: test/start_stack.sh
    - name: Run g1 tests
      run: test/tests_am.sh


  aias-tests-g1:
    if: inputs.run_aias_g1 == 'true' || inputs.run_all == 'true'
    runs-on: runner-8core-32gb
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack
      run: test/start_stack.sh
    - name: Run g1 tests
      run: test/tests_g1.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()
      
  aias-tests-g2:
    if: inputs.run_aias_g2 == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack
      run: test/start_stack.sh
    - name: Run g2 tests
      run: test/tests_g2.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()


  aias-tests-g3:
    if: inputs.run_aias_g3 == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack
      run: test/start_stack.sh
    - name: Run g3 tests
      run: test/tests_g3.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()
  

  aias-tests-g4-fs:
    if: inputs.run_aias_g4_fs == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack fs
      run: test/start_stack.sh
    - name: Run g4 tests fs
      run: test/tests_g4_fs.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()
  

  aias-tests-g4-gs:
    if: inputs.run_aias_g4_gs == 'true' || inputs.run_all == 'true'
    runs-on: runner-8core-32gb
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack gs
      run: test/start_stack.sh gs
    - name: Run g4 tests gs
      run: test/tests_g4_gs.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()
  

  aias-tests-g4-minio:
    if: inputs.run_aias_g4_minio == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install test/requirements
      run: |
        pip install -r test/requirements.txt
    - name: Start stack minio
      run: test/start_stack.sh minio
    - name: Run g4 tests minio
      run: test/tests_g4_minio.sh
    - name: Logs dockers aproc-service
      run: test/logs.sh aproc-service 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-1
      run: test/logs.sh compose-aproc-processes-fast-1 
      if: always()
    - name: Logs dockers compose-aproc-processes-fast-medium-large-1
      run: test/logs.sh compose-aproc-processes-fast-medium-large-1 
      if: always()
  

  geodes-stac-test:
    if: inputs.run_geodes_stac == 'true' || inputs.run_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install python/requirements-stac.txt
      run: |
        pip install -r python/requirements-stac.txt
    - name: Run  tests
      run: test/test_geodes_stac.sh
  